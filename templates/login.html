{% extends "base.html" %}
{% block title %}Sign in · NeuroScan NG{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card glass-strong reveal">
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to analyse MRI scans and review your history.</p>
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Email address
        <input type="email" name="email" required autocomplete="email" placeholder="you@hospital.gov.ng">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button class="btn btn-solid btn-lg btn-shimmer" type="submit">Sign in</button>
    </form>
    <p class="auth-alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
